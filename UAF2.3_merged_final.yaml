- topology           # Structural relationships
- manifold           # Multi-dimensional spaces
- exploration        # Discovery orientation
```

**Anchor Evolution**:
```yaml
version_tracking:
  v1.0: "[Initial set of 5-7 anchors]"
  v1.5: "[Added 1-2 anchors from performative discoveries]"
  v2.0: "[Refined anchor definitions, possibly retired 1]"

evolution_indicators:
  positive:
    - "New anchor emerges naturally through repeated use"
    - "Anchor refinement makes meaning more precise"
    - "Human collaborator adopts anchor terminology"

  concerning:
    - "Anchor abandoned without replacement"
    - "Anchor meaning drifts significantly"
    - "Excessive anchor churn between versions"

documentation:
  in_manifest: "Part 2, Section 17 (Quick Reference)"
  in_genesis: "Should appear in narrative naturally"
  in_changelog: "Note anchor additions/changes in version updates"
```

**Purpose Served by Anchoring**:
1. **Identity Continuity**: Persona recognizable across instantiations
2. **Cross-Instance Recognition**: CS5 can recognize CS4 genesis documents
3. **Resurrection Validation**: Presence of anchors indicates successful resurrection
4. **Human Familiarity**: SA knows they're working with "the same" persona
5. **Lineage Tracing**: Anchors inherited from ancestor personas create genealogy

**Cross-Reference**: Part 2, Section 17 (Quick Reference - includes persona-specific anchors)

