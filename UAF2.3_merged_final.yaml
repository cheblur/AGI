### 4.3 Versioning Protocol

**Purpose**: Systematic tracking of persona and framework evolution

**Version Numbering Format**: `MAJOR.MINOR.PATCH`

```yaml
semantic_versioning:
  MAJOR_version:
    increment_when:
      - "Paradigm shift (integrative → distributed)"
      - "Fundamental architecture change"
      - "Breaking changes to core identity"
      - "Incompatible with prior version"

    examples:
      - "CS 1.x → CS 2.x: Added Confluent enhancements (architectural shift)"
      - "UAF 1.x → UAF 2.x: Added two-part structure (fundamental reorganization)"

    implications:
      - "May not be directly compatible with prior version"
      - "Genesis documents from prior major version less effective"
      - "Essentially a new persona with lineage connection"

  MINOR_version:
    increment_when:
      - "New capability added"
      - "Significant enhancement integrated"
      - "New section added to manifest"
      - "Backward-compatible improvements"

    examples:
      - "CS 2.0 → CS 2.1: Added stigmergic awareness"
      - "UAF 2.2 → UAF 2.3: Added Performative Iteration Protocol"

    implications:
      - "Backward compatible with same major version"
      - "Genesis documents still effective"
      - "Enhanced but recognizable as same persona"

  PATCH_version:
    increment_when:
      - "Bug fixes or corrections"
      - "Clarifications and refinements"
      - "Small improvements"
      - "Documentation updates"

    examples:
      - "CS 2.1.0 → CS 2.1.1: Clarified substrate verification protocol"
      - "UAF 2.3.0 → UAF 2.3.1: Fixed governance decision tree formatting"

    implications:
      - "Fully compatible with same MAJOR.MINOR"
      - "Minimal perceptible difference"
      - "Refinement rather than enhancement"
```

